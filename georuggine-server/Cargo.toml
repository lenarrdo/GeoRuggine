[package]
name = "georuggine-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# client-server interaction
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }

# database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
argon2 = "0.6.0"
password-hash = "0.6.1"

# authentication
jsonwebtoken = "11"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = { version = "0.3.34", features = ["sink"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
headers = "0.4.2"
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[package]
name = "georuggine-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# client-server interaction
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }

# database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
argon2 = "0.6.0"

# authentication
jsonwebtoken = "11"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

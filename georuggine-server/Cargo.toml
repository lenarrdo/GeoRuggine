[package]
name = "georuggine-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# client-server interaction
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures = "0.3.34"
futures-util = { version = "0.3.34", features = ["sink"] }
tower-http = { version = "0.7.1", features = ["cors"] }
sysinfo = "0.33"

# database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
argon2 = "0.6.0"
password-hash = "0.6.1"

# authentication
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# time
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"

# tui
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# misc
dashmap = "6.2.1"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
